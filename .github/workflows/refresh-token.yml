name: Threadsトークンの自動更新

on:
  schedule:
    # 毎週月曜の日本時間 9:00（UTC 0:00）に実行。
    # Threads のトークンは60日で切れますが、毎週延長するので切れません。
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: トークンを延長して保存
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python refresh_threads_token.py
